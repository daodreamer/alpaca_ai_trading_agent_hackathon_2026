strategy:
  entry: dist_to_high(20) < 0.01 and realized_vol(20) < 0.20 and rvol(20) > 1.0 and close > sma(20)
  direction: long
  regime: close > ema(200) and slope(20) > 0
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: risk_reward
      ratio: 3.0
    max_holding_bars: 20
    signal_exit: close < ema(20)
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: tight_range_underperformance_reversal_long_v1
  version: 1
  hypothesis: When a stock trades in an extremely tight price range over a sustained period while underperforming
    the broad market (as proxied by a slow moving average), it indicates that buyers are absent and the
    stock is being accumulated by informed participants who are unwilling to push price higher. The eventual
    resolution of this tight range to the upside, confirmed by a rise in relative volume, often marks
    the start of a sustained move as these informed buyers step in and short-term mean-reversion traders
    who had sold the tight range are forced to cover. This edge persists because tight-range accumulation
    is a form of institutional positioning that is not immediately obvious to momentum traders, and the
    subsequent breakout traps those who had expected further downside.
  parent: a2b10cc6ad2bb94a
