strategy:
  entry: rel_return(20) > 0 and macd_hist(12, 26, 9) > 0 and rsi(14) < 70
  direction: long
  regime: breadth(20) < 0.2
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: risk_reward
      ratio: 3.0
    max_holding_bars: 20
    signal_exit: null
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: breadth_extreme_reversal_long_v2
  version: 1
  hypothesis: When market breadth is extremely low, it signals widespread panic selling. Stocks that maintain
    relative strength are being accumulated by informed buyers, and the subsequent mean-reversion move
    is amplified by short covering and the forced liquidation of late sellers. This persists because systematic
    strategies overreact to market-wide declines and ignore individual stock resilience.
