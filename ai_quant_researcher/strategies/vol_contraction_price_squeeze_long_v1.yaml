strategy:
  entry: vol_pct(20, 200) < 0.20 and close > highest(20) * 0.99 and rvol(20) > 1.0
  direction: long
  regime: close > ema(200) and slope(20) > 0
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: risk_reward
      ratio: 3.0
    max_holding_bars: 20
    signal_exit: close < ema(20)
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: vol_contraction_price_squeeze_long_v1
  version: 1
  hypothesis: When a stock's volatility contracts to historically low levels, it creates a coiled spring
    effect. A subsequent close above the recent tight range, even on modest volume, signals the resolution
    of this squeeze with a directional bias. The breakout attracts momentum traders who were waiting for
    confirmation, and their buying provides self-reinforcing upward pressure. This edge persists because
    volatility contraction is a period of accumulation, and the first breakout from a compressed range
    often leads to a sustained move as participants pile in.
  parent: d477534ce344ddea
