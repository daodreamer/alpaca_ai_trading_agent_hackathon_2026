strategy:
  entry: vol_pct(20, 200) < 0.30 and rvol(20) > 1.5 and close <= highest(20) * 0.995 and close > sma(10)
  direction: long
  regime: close > ema(200)
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: none
      ratio: 1.0
    max_holding_bars: 20
    signal_exit: close < ema(20)
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: vol_expansion_breakout_pullback_long_v1
  version: 1
  hypothesis: After a prolonged low-volatility contraction, a breakout on expanding volume signals genuine
    accumulation. When price pulls back to the breakout level without closing below it, the pullback traps
    late short sellers who expect a failed breakout, and their covering adds fuel to the continuation.
    This exploits the behavioral tendency to fade a breakout that has stalled, while the volume expansion
    confirms institutional participation.
  parent: a2b10cc6ad2bb94a
