strategy:
  entry: rvol(20) > 1.5 and roc(10) < -0.05 and atr_pct(14) > 0.02
  direction: long
  regime: breadth(20) < 0.2
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: risk_reward
      ratio: 2.0
    max_holding_bars: 20
    signal_exit: null
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: breadth_extreme_high_vol_targeting_long_v1
  version: 1
  hypothesis: During extreme market stress, systematic volatility-targeting funds are forced to deleverage
    by cutting their largest and most liquid positions. These price-insensitive sellers create temporary
    overreaction in high-beta, high-volume names. When volatility starts to normalize, the forced selling
    abates and these stocks rebound as risk appetite returns and systematic buyers re-enter.
  parent: null
