  name: extreme_rvol_trend_continuation_v1
  version: 1
  hypothesis: An unusual volume surge (rvol far above its recent average) often marks a shift in the balance
    of supply and demand, as large institutional participants or news-driven flows execute in one direction.
    When such a surge occurs in the direction of the prevailing short-term trend, the momentum from these
    informed or forced flows tends to persist, as counterparties (trend followers and passive investors)
    delay their response, providing a continuation edge. This exploitation of delayed price adjustment
    to volume shocks persists due to the slow diffusion of information and the reluctance of liquidity
    providers to step in against an accelerating trend.
