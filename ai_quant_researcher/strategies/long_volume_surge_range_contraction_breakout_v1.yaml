strategy:
  entry: rvol(20) > 1.5 and close > highest(20) * 0.99 and atr_pct(14) < 0.02
  direction: long
  regime: close > ema(200)
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: risk_reward
      ratio: 3.0
    max_holding_bars: 20
    signal_exit: close < ema(20)
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: long_volume_surge_range_contraction_breakout_v1
  version: 1
  hypothesis: After a period of low volatility and declining volume, a sudden volume surge with a narrow
    price range indicates institutional accumulation without price movement. When price breaks out of
    this range on continued high volume, it triggers momentum and breakout buyers, while the earlier accumulation
    provides a base. The edge persists because volume surge with low range often precedes informed buying,
    and the subsequent breakout attracts trend followers, leading to a self-reinforcing move.
  parent: null
