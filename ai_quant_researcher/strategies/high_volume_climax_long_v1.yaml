strategy:
  entry: close <= lowest(20) * 1.02 and rvol(20) > 1.5 and close < open
  direction: long
  regime: close > ema(200)
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.0
      period: 14
    take_profit:
      type: risk_reward
      ratio: 2.0
    max_holding_bars: 10
    signal_exit: close > ema(20)
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: high_volume_climax_long_v1
  version: 1
  hypothesis: A high-volume climax selling day, where price closes near the low after a sharp drop, often
    marks panic exhaustion as late longs capitulate and systematic trend-followers are forced to sell.
    The resulting intense volume indicates that the last marginal seller has acted, and the subsequent
    short squeeze as trapped shorts cover provides a sharp upward reversal. This edge persists because
    the crowd over-extrapolates the downside move and fails to recognize the exhaustion signal.
  parent: null
