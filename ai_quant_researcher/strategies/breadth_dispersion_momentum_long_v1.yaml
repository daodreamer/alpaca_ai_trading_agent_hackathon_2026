strategy:
  entry: rs_rank(10) > 0.8 and rel_return(10) > 0.02
  direction: long
  regime: breadth(5) < 0.2
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.5
      period: 14
    take_profit:
      type: risk_reward
      ratio: 3.0
    max_holding_bars: 10
    signal_exit: null
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: breadth_dispersion_momentum_long_v1
  version: 1
  hypothesis: During periods of extreme market stress (very low breadth), stocks with strong relative
    strength are likely being accumulated by informed buyers who are not panic-selling. A subsequent confirmation
    of relative strength persistence, as measured by a positive relative return over a short lookback,
    indicates that these informed flows are continuing and may be followed by forced short covering when
    the market mean-reverts. This edge persists because systematic strategies overreact to market-wide
    declines and fail to differentiate strong stocks from weak ones.
  parent: null
