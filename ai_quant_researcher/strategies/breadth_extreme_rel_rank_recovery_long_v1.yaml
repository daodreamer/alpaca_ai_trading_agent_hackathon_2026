strategy:
  entry: rs_rank(10) > 0.8 and rel_return(5) > 0.01
  direction: long
  regime: breadth(5) < 0.2
  max_positions: 3
  universe:
    symbols:
    - AAPL
    - AMD
    - AMZN
    - ASML
    - AVGO
    - AZN
    - COST
    - CSCO
    - GOOGL
    - INTU
    - LIN
    - META
    - MSFT
    - NFLX
    - NVDA
    - PEP
    - TMUS
    - TSLA
    - TXN
    timeframe: 1D
  exit:
    stop_loss:
      type: atr
      multiplier: 2.5
      period: 14
    take_profit:
      type: risk_reward
      ratio: 3.0
    max_holding_bars: 10
    signal_exit: null
  sizing:
    type: fixed_fractional
    risk_per_trade: 0.0075
    max_position_pct: 0.25
  name: breadth_extreme_rel_rank_recovery_long_v1
  version: 1
  hypothesis: During extreme market stress, strong relative strength stocks are accumulated by informed
    investors, and their recovery is amplified by systematic short covering. When breadth is very low,
    a positive short-term relative return confirms that informed flows are continuing, and the subsequent
    mean-reversion is fueled by forced covering as systematic strategies unwind. This persists because
    systematic strategies overreact to market-wide declines and fail to differentiate resilient stocks.
