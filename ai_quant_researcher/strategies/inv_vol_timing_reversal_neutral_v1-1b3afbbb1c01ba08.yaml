  name: inv_vol_timing_reversal_neutral_v1
  version: 1
  hypothesis: Stocks with extremely high relative strength and low volatility are systematically underweighted
    by benchmark-constrained investors because their low beta does not justify the tracking error, but
    as they are added to the index, passive flows and return-chasing investors force a reversal. Conversely,
    high-volatility stocks that have recently underperformed are not sold short due to constraints, but
    a relative strength rebound is driven by short covering and stop-loss triggers. The mechanism is the
    forced, price-insensitive flow from benchmark rebalancing and the behavioral overreaction to volatility,
    which should persist because institutional flows are slow and predictable.
  parent: null
